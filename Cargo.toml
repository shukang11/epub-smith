[package]
name = "epub-smith"
version = "0.1.0"
authors = ["Your Name <your.email@example.com>"]
description = "A predictable, explainable, and reusable TXT to EPUB CLI tool"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/shukang11/epub-smith"
repository = "https://github.com/shukang11/epub-smith"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "epub-smith"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "color", "wrap_help"] }
regex = "1.11"
encoding_rs = "0.8"
chardet = "0.2"
toml = "0.9"
serde = { version = "1.0", features = ["derive"] }
tera = "1.19"
zip = "0.6"
log = "0.4"
fern = "0.7"
console = "0.16"
indicatif = "0.18"
walkdir = "2.4"
slug = "0.1"
anyhow = "1.0"
thiserror = "1.0"
tempfile = "3.0"
uuid = { version = "1.4", features = ["v4"] }
chrono = "0.4"
rust-i18n = "3"
lazy_static = "1.4"

# Windows 系统语言检测
[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.0"
