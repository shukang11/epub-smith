[package]
name = "booksmith"
version = "0.1.0"
authors = ["Your Name <your.email@example.com>"]
description = "A predictable, explainable, and reusable TXT to EPUB CLI tool"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/yourusername/booksmith"
repository = "https://github.com/yourusername/booksmith"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "booksmith"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive", "color", "wrap_help"] }
regex = "1.10"
encoding_rs = "0.8"
chardet = "0.2"
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
tera = "1.19"
zip = "0.6"
log = "0.4"
fern = "0.6"
console = "0.15"
walkdir = "2.4"
slug = "0.1"
anyhow = "1.0"
thiserror = "1.0"
tempfile = "3.0"
uuid = { version = "1.4", features = ["v4"] }
chrono = "0.4"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.0"
