<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <style>:root {
  --color: black;
  --bg: white;
  --head-bg: white;
  --link: #338;

  --blue: #ccf;
  --red: #fcc;
  --yellow: #ffc;
  --green: #cfc;
}

[data-theme='dark'] {
  --color: white;
  --bg: black;
  --head-bg: #333;
  --link: #aaf;

  --blue: #225;
  --red: #522;
  --yellow: #552;
  --green: #252;
}

html,
body {
  margin: 0;
  padding: 0;
  color: var(--color);
  background: var(--bg);
}

.app {
  margin: 10px;
  padding: 0;
}

.files-list {
  margin: 10px 0 0;
  width: 100%;
  border-collapse: collapse;
}
.files-list__head {
  border: 1px solid #999;
}
.files-list__head > tr > th {
  padding: 10px;
  border: 1px solid #999;
  text-align: left;
  font-weight: normal;
  background: var(--head-bg);
}
.files-list__body {
}
.files-list__file {
  cursor: pointer;
}
.files-list__file:hover {
  background: var(--blue);
}
.files-list__file > td {
  padding: 10px;
  border: 1px solid #999;
}
.files-list__file > td:first-child::before {
  content: '\01F4C4';
  margin-right: 1em;
}
.files-list__file_low {
  background: var(--red);
}
.files-list__file_medium {
  background: var(--yellow);
}
.files-list__file_high {
  background: var(--green);
}
.files-list__file_folder > td:first-child::before {
  content: '\01F4C1';
  margin-right: 1em;
}

.file-header {
  border: 1px solid #999;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  background: var(--bg);
}

.file-header__back {
  margin: 10px;
  cursor: pointer;
  flex-shrink: 0;
  flex-grow: 0;
  text-decoration: underline;
  color: var(--link);
}

.file-header__name {
  margin: 10px;
  flex-shrink: 2;
  flex-grow: 2;
}

.file-header__stat {
  margin: 10px;
  flex-shrink: 0;
  flex-grow: 0;
}

.file-content {
  margin: 10px 0 0;
  border: 1px solid #999;
  padding: 10px;
  counter-reset: line;
  display: flex;
  flex-direction: column;
}

.code-line::before {
  content: counter(line);
  margin-right: 72px;
}
.code-line {
  margin: 0;
  height: 1em;
  counter-increment: line;

  position: absolute;
  padding: 0 0.3em 0.3em 0.3em;
  display: inherit;
  width: 100%;
}
.code-line_covered {
  background: var(--green);
}
.code-line_uncovered {
  background: var(--red);
}

.code-text-container {
  position: relative;
  height: 1em;
  padding: 0.3em 0;
}

.cover-indicator {
  display: flex;
  width: 100%;
  position: absolute;
  justify-content: end;
  height: 1em;
  align-items: center;
  padding: 0 0.3em 0.3em 0.3em;
}

.cover-indicator.check-cover::after {
  content: "\2713";
  font-weight: bold;
  background-color: var(--green);
  height: 1em;
}

.cover-indicator.no-cover::after {
  content: "\2716";
  font-weight: bold;
  background-color: var(--red);
  height: 1em;
}

.stat-line-hit {
  max-width: 48px;
  overflow: hidden;
  font-weight: bold;
  margin-right: 4px;
  background-color: var(--green);
  position: relative;
  top: 0.1em;
}

#theme-toggle-label {
  margin-left: 1ch;
}
</style>
</head>

        }\n        \n        prev = current;\n    }\n    \n    Some(result)\n}\n\n/// 阿拉伯数字直接转换（用于类型统一）\npub fn convert_arabic_to_arabic(num_str: \u0026str) -\u003e Option\u003cusize\u003e {\n    num_str.parse::\u003cusize\u003e().ok()\n}\n\n/// 统一数字转换函数，支持自动识别数字类型\npub fn convert_number(num_str: \u0026str, number_type: \u0026str) -\u003e Option\u003cusize\u003e {\n    match number_type {\n        \"auto\" =\u003e {\n            // 自动识别数字类型\n            convert_arabic_to_arabic(num_str)\n                .or_else(|| convert_chinese_to_arabic(num_str))\n                .or_else(|| convert_english_to_arabic(num_str))\n                .or_else(|| convert_roman_to_arabic(num_str))\n        },\n        \"arabic\" =\u003e convert_arabic_to_arabic(num_str),\n        \"chinese\" =\u003e convert_chinese_to_arabic(num_str),\n        \"english\" =\u003e convert_english_to_arabic(num_str),\n        \"roman\" =\u003e convert_roman_to_arabic(num_str),\n        _ =\u003e None,\n    }\n}\n\n/// 从章节标题中提取序号\npub fn extract_chapter_number(title: \u0026str, extraction_rules: \u0026Option\u003ccrate::models::ChapterNumberExtraction\u003e) -\u003e Option\u003cusize\u003e {\n    use regex::Regex;\n    \n    // 如果没有配置自定义规则，使用默认规则\n    let rules = match extraction_rules {\n        Some(rules) =\u003e \u0026rules.rules,\n        None =\u003e \u0026crate::models::ChapterNumberExtraction::default().rules,\n    };\n    \n    // 按优先级尝试匹配规则\n    for rule in rules {\n        if let Ok(regex) = Regex::new(\u0026rule.pattern) {\n            if let Some(captures) = regex.captures(title) {\n                if let Some(num_str) = captures.get(rule.capture_group) {\n                    if let Some(num) = convert_number(num_str.as_str(), \u0026rule.number_type) {\n                        return Some(num);\n                    }\n                }\n            }\n        }\n    }\n    \n    None\n}\n","traces":[{"line":9,"address":[],"length":0,"stats":{"Line":66}},{"line":11,"address":[],"length":0,"stats p_dir.keep();\n    \n    let mut xhtml_files = Vec::new();\n    \n    // 渲染每个章节\n    for (i, chapter) in book.chapters.iter().enumerate() {\n        let xhtml_path = temp_path.join(format!(\"chapter_{:03}.xhtml\", i + 1));\n        render_chapter(chapter, i + 1, book, \u0026tera, \u0026xhtml_path)?;\n        xhtml_files.push(xhtml_path);\n    }\n    \n    // 渲染导航文件\n    let nav_path = temp_path.join(\"nav.xhtml\");\n    render_nav(book, \u0026tera, \u0026nav_path)?;\n    xhtml_files.push(nav_path);\n    \n    // 渲染CSS文件\n    let css_path = temp_path.join(\"style.css\");\n    render_css(\u0026css_path)?;\n    xhtml_files.push(css_path);\n    \n    // 渲染OPF文件\n    let opf_path = temp_path.join(\"content.opf\");\n    render_opf(book, \u0026xhtml_files, \u0026tera, \u0026opf_path)?;\n    xhtml_files.push(opf_path);\n    \n    // 渲染mimetype文件\n    let mimetype_path = temp_path.join(\"mimetype\");\n    render_mimetype(\u0026mimetype_path)?;\n    xhtml_files.push(mimetype_path);\n    \n    // 渲染container.xml文件\n    let container_path = temp_path.join(\"META-INF/container.xml\");\n    std::fs::create_dir_all(temp_path.join(\"META-INF\"))?;\n    render_container(\u0026container_path)?;\n    xhtml_files.push(container_path);\n    \n    Ok(xhtml_files)\n}\n\n/// 初始化Tera模板引擎\nfn initialize_tera() -\u003e Result\u003cTera\u003e {\n    // 创建Tera实例，添加所有模板\n    let mut tera = Tera::default();\n    \n    // 添加章节模板\n    tera.add_raw_template(\"chapter.xhtml\", include_str!(\"../templates/chapter.xhtml.tera\"))?;\n    \n    // 添加导航模板\n    tera.add_raw_template(\"nav.xhtml\", include_str!(\"../templates/nav.xhtml.tera\"))?;\n    \n    // 添加OPF模板\n    tera.add_raw_template(\"content.opf\", include_str!(\"../templates/content.opf.tera\"))?;\n    \n    Ok(tera)\n}\n\n/// 渲染单个章节为XHTML文件\nfn render_chapter(chapter: \u0026Chapter, chapter_num: usize, book: \u0026Book, tera: \u0026Tera, output_path: \u0026PathBuf) -\u003e Result\u003c()\u003e {\n    let mut context = TeraContext::new();\n    context.insert(\"chapter\", chapter);\n    context.insert(\"chapter_num\", \u0026chapter_num);\n    context.insert(\"book\", book);\n    \n    let rendered = tera.render(\"chapter.xhtml\", \u0026context)?;\n    std::fs::write(output_path, rendered)?;\n    \n    Ok(())\n}\n\n/// 渲染导航文件\nfn render_nav(book: \u0026Book, tera: \u0026Tera, output_path: \u0026PathBuf) -\u003e Result\u003c()\u003e {\n    let mut context = TeraContext::new();\n    context.insert(\"book\", book);\n    \n    let rendered = tera.render(\"nav.xhtml\", \u0026context)?;\n    std::fs::write(output_path, rendered)?;\n    \n    Ok(())\n}\n\n/// 渲染OPF文件\nfn render_opf(book: \u0026Book, xhtml_files: \u0026[PathBuf], tera: \u0026Tera, output_path: \u0026PathBuf) -\u003e Result\u003c()\u003e {\n    let mut context = TeraContext::new();\n    context.insert(\"book\", book);\n    \n    // 收集所有XHTML文件的文件名\n    let xhtml_filenames: Vec\u003cString\u003e = xhtml_files\n        .iter()\n        .filter(|path| path.extension().map(|ext| ext == \"xhtml\").unwrap_or(false))\n        .map(|path| path.file_name().unwrap().to_string_lossy().to_string())\n        .collect();\n    \n    context.insert(\"xhtml_files\", \u0026xhtml_filenames);\n    \n    let rendered = tera.render(\"content.opf\", \u0026context)?;\n    std::fs::write(output_path, rendered)?;\n    \n    Ok(())\n}\n\n/// 渲染CSS文件\nfn render_css(output_path: \u0026PathBuf) -\u003e Result\u003c()\u003e {\n    // 使用默认CSS内容\n    let css_content = include_str!(\"../resources/css/default.css\");\n    std::fs::write(output_path, css_content)?;\n    \n    Ok(())\n}\n\n/// 渲染mimetype文件\nfn render_mimetype(output_path: \u0026PathBuf) -\u003e Result\u003c()\u003e {\n    std::fs::write(output_path, \"application/epub+zip\")?;\n    \n    Ok(())\n}\n\n/// 渲染container.xml文件\nfn render_container(output_path: \u0026PathBuf) -\u003e Result\u003c()\u003e {\n    let container_content = r#\"\u003c?xml version=\"1.0\" encoding=\"UTF-8\"?\u003e\n\u003ccontainer version=\"1.0\" xmlns=\"urn:oasis:names:tc:opendocument:xmlns:container\"\u003e\n  \u003crootfiles\u003e\n    \u003crootfile full-path=\"content.opf\" media-type=\"application/oebps-package+xml\"/\u003e\n  \u003c/rootfiles\u003e\n\u003c/container\u003e\"#;\n    \n    std::fs::write(output_path, container_content)?;\n    \n    Ok(())\n}\n","traces":[{"line":9,"address":[],"length":0,"stats":{"Line":0}},{"line":11,"address":[],"length":0,"stats":{"Line":0}},{"line":14,"address":[],"length":0,"stats":{"Line":0}},{"line":15,"address":[],"length":0,"stats":{"Line":0}},{"line":18,"address":[],"length":0,"stats":{"Line":0}},{"line":19,"address":[],"length":0,"stats":{"Line":0}},{"line":21,"address":[],"length":0,"stats":{"Line":0}},{"line":24,"address":[],"length":0,"stats":{"Line":0}},{"line":25,"address":[],"length":0,"stats":{"Line":0}},{"line":26,"address":[],"length":0,"stats":{"Line":0}},{"line":27,"address":[],"length":0,"stats":{"Line":0}},{"line":31,"address":[],"length":0,"stats":{"Line":0}},{"line":32,"address":[],"length":0,"stats":{"Line":0}},{"line":33,"address":[],"length":0,"stats":{"Line":0}},{"line":36,"address":[],"length":0,"stats":{"Line":0}},{"line":37,"address":[],"length":0,"stats":{"Line":0}},{"line":38,"address":[],"length":0,"stats":{"Line":0}},{"line":41,"address":[],"length":0,"stats":{"Line":0}},{"line":42,"address":[],"length":0,"stats":{"Line":0}},{"line":43,"address":[],"length":0,"stats":{"Line":0}},{"line":46,"address":[],"length":0,"stats":{"Line":0}},{"line":47,"address":[],"length":0,"stats":{"Line":0}},{"line":48,"address":[],"length":0,"stats":{"Line":0}},{"line":51,"address":[],"length":0,"stats":{"Line":0}},{"line":52,"address":[],"length":0,"stats":{"Line":0}},{"line":53,"address":[],"length":0,"stats":{"Line":0}},{"line":54,"address":[],"length":0,"stats":{"Line":0}},{"line":56,"address":[],"length":0,"stats":{"Line":0}},{"line":60,"address":[],"length":0,"stats":{"Line":0}},{"line":62,"address":[],"length":0,"stats":{"Line":0}},{"line":65,"addre _eq!(convert_english_to_arabic(\"1\"), Some(1));\n    assert_eq!(convert_english_to_arabic(\"10\"), Some(10));\n    \n    // 测试英文单词数字\n    assert_eq!(convert_english_to_arabic(\"one\"), Some(1));\n    assert_eq!(convert_english_to_arabic(\"One\"), Some(1));\n    assert_eq!(convert_english_to_arabic(\"ONE\"), Some(1));\n    assert_eq!(convert_english_to_arabic(\"two\"), Some(2));\n    assert_eq!(convert_english_to_arabic(\"nine\"), Some(9));\n    assert_eq!(convert_english_to_arabic(\"ten\"), Some(10));\n    \n    // 测试无法识别的英文数字\n    assert_eq!(convert_english_to_arabic(\"eleven\"), None);\n    assert_eq!(convert_english_to_arabic(\"abc\"), None);\n}\n\n#[test]\nfn test_roman_number_conversion() {\n    // 测试基本罗马数字\n    assert_eq!(convert_roman_to_arabic(\"I\"), Some(1));\n    assert_eq!(convert_roman_to_arabic(\"V\"), Some(5));\n    assert_eq!(convert_roman_to_arabic(\"X\"), Some(10));\n    assert_eq!(convert_roman_to_arabic(\"L\"), Some(50));\n    assert_eq!(convert_roman_to_arabic(\"C\"), Some(100));\n    assert_eq!(convert_roman_to_arabic(\"D\"), Some(500));\n    assert_eq!(convert_roman_to_arabic(\"M\"), Some(1000));\n    \n    // 测试组合罗马数字\n    assert_eq!(convert_roman_to_arabic(\"II\"), Some(2));\n    assert_eq!(convert_roman_to_arabic(\"III\"), Some(3));\n    assert_eq!(convert_roman_to_arabic(\"IV\"), Some(4));\n    assert_eq!(convert_roman_to_arabic(\"VI\"), Some(6));\n    assert_eq!(convert_roman_to_arabic(\"IX\"), Some(9));\n    assert_eq!(convert_roman_to_arabic(\"XII\"), Some(12));\n    assert_eq!(convert_roman_to_arabic(\"XXI\"), Some(21));\n    assert_eq!(convert_roman_to_arabic(\"XLV\"), Some(45));\n    assert_eq!(convert_roman_to_arabic(\"XC\"), Some(90));\n    assert_eq!(convert_roman_to_arabic(\"CD\"), Some(400));\n    assert_eq!(convert_roman_to_arabic(\"CM\"), Some(900));\n    assert_eq!(convert_roman_to_arabic(\"MCMXCIV\"), Some(1994));\n    \n    // 测试小写罗马数字\n    assert_eq!(convert_roman_to_arabic(\"i\"), Some(1));\n    assert_eq!(convert_roman_to_arabic(\"ii\"), Some(2));\n    assert_eq!(convert_roman_to_arabic(\"iii\"), Some(3));\n    assert_eq!(convert_roman_to_arabic(\"iv\"), Some(4));\n    assert_eq!(convert_roman_to_arabic(\"v\"), Some(5));\n    \n    // 测试无法识别的罗马数字\n    assert_eq!(convert_roman_to_arabic(\"A\"), None);\n    assert_eq!(convert_roman_to_arabic(\"abc\"), None);\n}\n\n#[test]\nfn test_unified_number_conversion() {\n    // 测试阿拉伯数字转换\n    assert_eq!(convert_number(\"1\", \"arabic\"), Some(1));\n    assert_eq!(convert_number(\"10\", \"arabic\"), Some(10));\n    \n    // 测试中文数字转换\n    assert_eq!(convert_number(\"一\", \"chinese\"), Some(1));\n    assert_eq!(convert_number(\"十\", \"chinese\"), Some(10));\n    \n    // 测试英文数字转换\n    assert_eq!(convert_number(\"one\", \"english\"), Some(1));\n    assert_eq!(convert_number(\"ten\", \"english\"), Some(10));\n    \n    // 测试罗马数字转换\n    assert_eq!(convert_number(\"I\", \"roman\"), Some(1));\n    assert_eq!(convert_number(\"X\", \"roman\"), Some(10));\n    \n    // 测试自动识别\n    assert_eq!(convert_number(\"1\", \"auto\"), Some(1));\n    assert_eq!(convert_number(\"一\", \"auto\"), Some(1));\n    assert_eq!(convert_number(\"one\", \"auto\"), Some(1));\n    assert_eq!(convert_number(\"I\", \"auto\"), Some(1));\n    \n    // 测试无法识别的数字\n    assert_eq!(convert_number(\"unknown\", \"auto\"), None);\n    assert_eq!(convert_number(\"abc\", \"arabic\"), None);\n}\n\n#[test]\nfn test_chapter_number_extraction() {\n    // 测试默认规则下的中文数字提取\n    assert_eq!(extract_chapter_number(\"第1章\", \u0026None), Some(1));\n    assert_eq!(extract_chapter_number(\"1章\", \u0026None), Some(1));\n    assert_eq!(extract_chapter_number(\"第一章\", \u0026None), Some(1));\n    assert_eq!(extract_chapter_number(\"第十章\", \u0026None), Some(10));\n    assert_eq!(extract_chapter_number(\"第10章\", \u0026None), Some(10));\n    assert_eq!(extract_chapter_number(\"第1节\", \u0026None), Some(1));\n    assert_eq!(extract_chapter_number(\"第1卷\", \u0026None), Some(1));\n    assert_eq!(extract_chapter_number(\"第1张\", \u0026None), Some(1));\n    \n    // 测试默认规则下的英文数字提取\n    assert_eq!(extract_chapter_number(\"Chapter 1\", \u0026None), Some(1));\n    assert_eq!(extract_chapter_number(\"Chapter Two\", \u0026None), Some(2));\n    assert_eq!(extract_chapter_number(\"Section 1\", \u0026None), Some(1));\n    \n    // 测试默认规则下的罗马数字提取\n    assert_eq!(extract_chapter_number(\"Chapter I\", \u0026None), Some(1));\n    assert_eq!(extract_chapter_number(\"Chapter II\", \u0026None), Some(2));\n    assert_eq!(extract_chapter_number(\"Section III\", \u0026None), Some(3));\n    \n    // 测试无法提取章节号的情况\n    assert_eq!(extract_chapter_number(\"序\", \u0026None), None);\n    assert_eq!(extract_chapter_number(\"番外：某件小事\", \u0026None), None);\n    assert_eq!(extract_chapter_number(\"尾声\", \u0026None), None);\n}\n\n#[test]\nfn test_custom_extraction_rules() {\n    // 创建自定义规则\n    let custom_rules = ChapterNumberExtraction {\n        rules: vec![\n            ChapterNumberRule {\n                pattern: \"^Episode ([0-9]+):\".to_string(),\n                capture_group: 1,\n                number_type: \"arabic\".to_string(),\n            },\n            ChapterNumberRule {\n                pattern: \"^Special ([0-9]+):\".to_string(),\n                capture_group: 1,\n                number_type: \"arabic\".to_string(),\n            },\n        ],\n    };\n    \n    // 测试自定义规则\n    assert_eq!(extract_chapter_number(\"Episode 1: The Beginning\", \u0026Some(custom_rules.clone())), Some(1));\n    assert_eq!(extract_chapter_number(\"Episode 2: The Journey\", \u0026Some(custom_rules.clone())), Some(2));\n    assert_eq!(extract_chapter_number(\"Special 1: Bonus Content\", \u0026Some(custom_rules.clone())), Some(1));\n    \n    // 测试自定义规则无法匹配的情况\n    assert_eq!(extract_chapter_number(\"Chapter 1\", \u0026Some(custom_rules.clone())), None);\n    assert_eq!(extract_chapter_number(\"第1章\", \u0026Some(custom_rules.clone())), None);\n}\n\n#[test]\nfn test_mixed_chapter_formats() {\n    // 测试混合章节格式\n    le es","Storage","Documents","project","book-smith","src","main.rs"],"content":"use anyhow::{Context, Result};\nuse clap::Parser;\nuse console::style;\nuse log::info;\n\nuse booksmith::{cli::Args, config::Config, parser::parse_txt, renderer::render_book, packager::package_epub, extract_chapter_number};\n\n/// 检查章节的连贯性\nfn check_chapter_coherence(chapters: \u0026[booksmith::models::Chapter], extraction_rules: \u0026Option\u003cbooksmith::models::ChapterNumberExtraction\u003e, ignore_rules: \u0026Option\u003cVec\u003cString\u003e\u003e) {\n    use regex::Regex;\n    \n    // 编译忽略规则\n    let ignore_patterns: Vec\u003cRegex\u003e = if let Some(patterns) = ignore_rules {\n        patterns.iter()\n            .filter_map(|pattern| Regex::new(pattern).ok())\n            .collect()\n    } else {\n        Vec::new()\n    };\n    \n    // 提取章节号，同时过滤掉需要忽略的章节\n    let chapter_data: Vec\u003cOption\u003cusize\u003e\u003e = chapters\n        .iter()\n        .filter(|chapter| {\n            // 检查章节是否需要忽略\n            !ignore_patterns.iter().any(|regex| regex.is_match(\u0026chapter.title))\n        })\n        .map(|chapter| extract_chapter_number(\u0026chapter.title, extraction_rules))\n        .collect();\n    \n    // 只保留有明确章节号的章节\n    let numbered_chapters: Vec\u003cusize\u003e = chapter_data\n        .iter()\n        .filter_map(|num| *num)\n        .collect();\n    \n    if !numbered_chapters.is_empty() {\n        // 检查是否有重复的章节号\n        let mut unique_nums = std::collections::HashSet::new();\n        for num in \u0026numbered_chapters {\n            if !unique_nums.insert(*num) {\n                println!(\"{}\", style(format!(\"⚠️  警告：发现重复的章节号: {}\", num)).yellow());\n            }\n        }\n        \n        // 检查章节号是否递增\n        let mut is_increasing = true;\n        for i in 1..numbered_chapters.len() {\n            if numbered_chapters[i] \u003c= numbered_chapters[i-1] {\n                is_increasing = false;\n                println!(\"{}\", style(format!(\"⚠️  警告：章节号不是递增的，从 {} 到 {}\", numbered_chapters[i-1], numbered_chapters[i])).yellow());\n            }\n        }\n        \n        if is_increasing {\n            println!(\"{}\", style(\"✅ 章节号是递增的，符合要求\").green());\n        }\n    } else {\n        // 如果没有提取到章节号，不进行连贯性检查\n        println!(\"{}\", style(\"ℹ️  未检测到明确的章节号，跳过连贯性检查\").cyan());\n    }\n}\n\nfn main() -\u003e Result\u003c()\u003e {\n    // 根据是否为verbose模式，选择不同的日志级别\n    let log_level = if Args::try_parse_from(std::env::args_os())\n        .map(|args| args.verbose)\n        .unwrap_or(false) {\n        log::LevelFilter::Info\n    } else {\n        log::LevelFilter::Warn\n    };\n\n    // 初始化日志，只初始化一次\n    fern::Dispatch::new()\n        .format(|out, message, record| {\n            out.finish(format_args!(\n                \"[{}] {}\",\n                record.level(),\n                message\n            ))\n        })\n        .level(log_level)\n        .chain(std::io::stdout())\n        .apply()?;\n\n    // 解析命令行参数\n    let args = Args::parse();\n\n    info!(\"Starting BookSmith v{}\", env!(\"CARGO_PKG_VERSION\"));\n    info!(\"Input: {}\", args.input.display());\n\n    // 加载配置\n    let config = Config::from_args(\u0026args)?;\n\n    // 解析TXT文件\n    let mut book = parse_txt(\u0026args.input, \u0026config)\n        .with_context(|| format!(\"Failed to parse input file: {}\", args.input.display()))?;\n\n    // 合并元数据\n    book.meta = config.merge_meta(\u0026args, book.meta.title.as_str());\n\n    // 检查章节连贯性\n    check_chapter_coherence(\u0026book.chapters, \u0026config.rules.chapter_number_extraction, \u0026config.rules.ignore);\n\n    // 处理dry-run模式\n    if args.dry_run {\n        println!(\"{}\", style(\"Detected chapters:\").bold());\n        for (i, chapter) in book.chapters.iter().enumerate() {\n            println!(\"[{:03}] {} (lines {}-{})\n\", i + 1, chapter.title, chapter.start_line + 1, chapter.end_line + 1);\n        }\n        return Ok(());\n    }\n\n    // 处理print-outline模式\n    if args.print_outline {\n        println!(\"{}\", style(\"Chapter outline:\").bold());\n        for (i, chapter) in book.chapters.iter().enumerate() {\n            println!(\"{}. {}\", i + 1, chapter.title);\n        }\n        return Ok(());\n    }\n\n    // 渲染XHTML\n    let xhtml_files = render_book(\u0026book, \u0026config)\n        .with_context(|| \"Failed to render XHTML files\")?;\n\n    // 打包EPUB\n    package_epub(\u0026book, \u0026xhtml_files, \u0026config)\n        .with_context(|| format!(\"Failed to package EPUB to: {}\", config.output.display()))?;\n\n    println!(\"{}\", style(\"✓ EPUB generated successfully!\").green().bold());\n    println!(\"Output: {}\", style(config.output.display()).blue());\n\n    Ok(())\n}\n","traces":[{"line":9,"address":[],"length":0,"stats":{"Line":11}},{"line":11,"address":[],"length":0,"stats":{"Line":33}},{"line":13,"address":[],"length":0,"stats":{"Line":131}},{"line":17,"address":[],"length":0,"stats":{"Line":33}},{"line":19,"address":[],"length":0,"stats":{"Line":11}},{"line":22,"address":[],"length":0,"stats":{"Line":11}},{"line":24,"address":[],"length":0,"stats":{"Line":22}},{"line":25,"address":[],"length":0,"stats":{"Line":85}},{"line":26,"address":[],"length":0,"stats":{"Line":84}},{"line":27,"address":[],"length":0,"stats":{"Line":50}},{"line":32,"address":[],"length":0,"stats":{"Line":22}},{"line":33,"address":[],"length":0,"stats":{"Line":48}},{"line":34,"address":[],"length":0,"stats":{"Line":61}},{"line":35,"address":[],"length":0,"stats":{"Line":18}},{"line":36,"address":[],"length":0,"stats":{"Line":63}},{"line":40,"address":[],"length":0,"stats":{"Line":17}},{"line":41,"address":[],"length":0,"stats":{"Line":18}},{"line":45,"address":[],"length":0,"stats":{"Line":0}},{"line":49,"address":[],"length":0,"stats":{"Line":13}},{"line":51,"address":[],"length":0,"stats":{"Line":39}},{"line":52,"address":[],"length":0,"stats":{"Line":13}},{"line":54,"address":[],"length":0,"stats":{"Line":1}},{"line":56,"address":[],"length":0,"stats" b rules: Vec\u003cChapterNumberRule\u003e,\n}\n\n/// 规则文件结构\n#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct Rules {\n    /// 章节解析规则\n    pub chapter: ChapterRules,\n    /// 章节序号提取规则\n    pub chapter_number_extraction: Option\u003cChapterNumberExtraction\u003e,\n    /// 段落处理规则\n    pub paragraph: ParagraphRules,\n    /// 元数据配置（可选）\n    pub meta: Option\u003cMeta\u003e,\n    /// 忽略连贯性检查的章节正则表达式列表\n    pub ignore: Option\u003cVec\u003cString\u003e\u003e,\n}\n\n/// Meta的默认实现\nimpl Default for Meta {\n    fn default() -\u003e Self {\n        Self {\n            title: \"Untitled\".to_string(),\n            author: \"Unknown\".to_string(),\n            language: \"zh-CN\".to_string(),\n            identifier: format!(\"urn:uuid:{}\", uuid::Uuid::new_v4()),\n            modified: chrono::Utc::now().to_rfc3339(),\n            cover: None,\n        }\n    }\n}\n\n/// ChapterRules的默认实现\nimpl Default for ChapterRules {\n    fn default() -\u003e Self {\n        Self {\n            regex: vec![\n                r\"^(?:第)?[一二三四五六七八九十0-9]+章\".to_string(),\n                r\"^(?:第)?[一二三四五六七八九十0-9]+节\".to_string(),\n                r\"^(?:第)?[一二三四五六七八九十0-9]+卷\".to_string(),\n                r\"^(?:第)?[一二三四五六七八九十0-9]+张\".to_string(),\n                r\"^Chapter\\s+\".to_string(),\n                r\"^Section\\s+\".to_string(),\n                r\"^Part\\s+\".to_string(),\n                r\"^番外\".to_string(),\n                r\"^序\".to_string(),\n                r\"^尾声\".to_string(),\n                r\"^后记\".to_string(),\n                r\"^附录\".to_string(),\n            ],\n        }\n    }\n}\n\n/// ChapterNumberExtraction的默认实现\nimpl Default for ChapterNumberExtraction {\n    fn default() -\u003e Self {\n        Self {\n            rules: vec![\n                // 中文格式：第X章, X章, 第一章\n                ChapterNumberRule {\n                    pattern: \"^(?:第)?([一二三四五六七八九十0-9]+)[章节卷张节]\".to_string(),\n                    capture_group: 1,\n                    number_type: \"auto\".to_string(),\n                },\n                // 英文格式：Chapter 1, Section 2\n                ChapterNumberRule {\n                    pattern: \"^(?:Chapter|Section|Part)\\\\s+([a-zA-Z0-9]+)\".to_string(),\n                    capture_group: 1,\n                    number_type: \"auto\".to_string(),\n                },\n                // 罗马数字格式：Chapter I, Section II\n                ChapterNumberRule {\n                    pattern: \"^(?:Chapter|Section|Part)\\\\s+([IVXLCDMivxlcdm]+)\".to_string(),\n                    capture_group: 1,\n                    number_type: \"roman\".to_string(),\n                },\n                // 纯数字格式：1, 2, 3\n                ChapterNumberRule {\n                    pattern: r\"^(\\d+)$\".to_string(),\n                    capture_group: 1,\n                    number_type: \"arabic\".to_string(),\n                },\n            ],\n        }\n    }\n}\n\n/// Rules的默认实现\nimpl Default for Rules {\n    fn default() -\u003e Self {\n        Self {\n            chapter: ChapterRules::default(),\n            chapter_number_extraction: None,\n            paragraph: ParagraphRules::default(),\n            meta: None,\n            ignore: None,\n        }\n    }\n}\n","traces":[{"line":5,"address":[],"length":0,"stats":{"Line":0}},{"line":6,"address":[],"length":0,"stats":{"Line":0}},{"line":10,"address":[],"length":0,"stats":{"Line":0}},{"line":11,"address":[],"length":0,"stats":{"Line":0}},{"line":106,"address":[],"length":0,"stats":{"Line":11}},{"line":108,"address":[],"length":0,"stats":{"Line":33}},{"line":109,"address":[],"length":0,"stats":{"Line":33}},{"line":110,"address":[],"length":0,"stats":{"Line":33}},{"line":111,"address":[],"length":0,"stats":{"Line":44}},{"line":112,"address":[],"length":0,"stats":{"Line":22}},{"line":120,"address":[],"length":0,"stats":{"Line":12}},{"line":122,"address":[],"length":0,"stats":{"Line":24}},{"line":142,"address":[],"length":0,"stats":{"Line":80}},{"line":144,"address":[]," sion_method(CompressionMethod::Stored))?;\n    \n    // 写入mimetype内容\n    zip.write_all(b\"application/epub+zip\")?;\n    \n    Ok(())\n}\n\n/// 添加文件到ZIP\nfn add_file_to_zip(\n    zip: \u0026mut ZipWriter\u003cstd::fs::File\u003e, \n    file_path: \u0026PathBuf, \n    entry_name: \u0026str\n) -\u003e Result\u003c()\u003e {\n    // 读取文件内容\n    let content = std::fs::read(file_path)?;\n    \n    // 创建ZIP条目，使用deflate压缩\n    zip.start_file(entry_name, FileOptions::default().compression_method(CompressionMethod::Deflated))?;\n    \n    // 写入文件内容\n    zip.write_all(\u0026content)?;\n    \n    Ok(())\n}\n\n/// 验证EPUB文件\nfn validate_epub(path: \u0026PathBuf) -\u003e Result\u003c()\u003e {\n    // 注意：这里应该调用epubcheck工具\n    // 由于epubcheck是一个外部工具，我们暂时只进行简单的验证\n    // 检查文件是否存在且大小合理\n    \n    let metadata = std::fs::metadata(path)?;\n    \n    if metadata.len() \u003c 100 {\n        anyhow::bail!(\"EPUB file is too small, may be invalid: {}\", path.display());\n    }\n    \n    println!(\"EPUB file created successfully: {}\", path.display());\n    println!(\"Note: epubcheck validation is not implemented yet.\");\n    println!(\"To validate your EPUB, download epubcheck from https://github.com/w3c/epubcheck\");\n    println!(\"and run: java -jar epubcheck.jar {}\", path.display());\n    \n    Ok(())\n}\n","traces":[{"line":10,"address":[],"length":0,"stats":{"Line":0}},{"line":12,"address":[],"length":0,"stats":{"Line":0}},{"line":15,"address":[],"length":0,"stats":{"Line":0}},{"line":18,"address":[],"length":0,"stats":{"Line":0}},{"line":21,"address":[],"length":0,"stats":{"Line":0}},{"line":23,"address":[],"length":0,"stats":{"Line":0}},{"line":24,"address":[],"length":0,"stats":{"Line":0}},{"line":25,"address":[],"length":0,"stats":{"Line":0}},{"line":28,"address":[],"length":0,"stats":{"Line":0}},{"line":29,"address":[],"length":0,"stats":{"Line":0}},{"line":33,"address":[],"length":0,"stats":{"Line":0}},{"line":34,"address":[],"length":0,"stats":{"Line":0}},{"line":36,"addr     let mut chapter_starts: Vec\u003c(usize, \u0026str)\u003e = Vec::new();\n    \n    if explain {\n        println!(\"使用的章节正则表达式：\");\n        for (i, pattern) in rules.chapter.regex.iter().enumerate() {\n            println!(\"  {}. {}\", i + 1, pattern);\n        }\n        println!();\n        \n        println!(\"检测章节起始位置：\");\n    }\n    \n    for (line_num, line) in lines.iter().enumerate() {\n        // 检查该行是否匹配任何章节模式\n        for (i, regex) in regex_patterns.iter().enumerate() {\n            if regex.is_match(line) {\n                if explain {\n                    println!(\"  行 {}: 匹配正则 {} -\u003e {}\", line_num + 1, i + 1, line.trim());\n                }\n                chapter_starts.push((line_num, line));\n                break;\n            }\n        }\n    }\n\n    // 如果没有找到章节，将整个文件视为一个章节\n    if chapter_starts.is_empty() {\n        let end_line = if lines.is_empty() {\n            0\n        } else {\n            lines.len() - 1\n        };\n        let chapter = create_chapter(lines, 0, end_line, \"Chapter 1\", rules)?;\n        return Ok(vec![chapter]);\n    }\n\n    // 从起始位置创建章节\n    let mut chapters = Vec::new();\n    \n    for (i, (start_line, title)) in chapter_starts.iter().enumerate() {\n        let end_line = if i \u003c chapter_starts.len() - 1 {\n            chapter_starts[i + 1].0 - 1\n        } else {\n            lines.len() - 1\n        };\n        \n        let chapter = create_chapter(lines, *start_line, end_line, title, rules)?;\n        chapters.push(chapter);\n    }\n\n    Ok(chapters)\n}\n\n/// 从行范围创建章节\nfn create_chapter(\n    lines: \u0026[\u0026str], \n    start_line: usize, \n    end_line: usize, \n    raw_title: \u0026str, \n    rules: \u0026Rules\n) -\u003e Result\u003cChapter\u003e {\n    // 提取章节内容行，处理空切片的情况\n    let content_lines = if lines.is_empty() {\n        \u0026[]\n    } else {\n        \u0026lines[start_line..=end_line]\n    };\n    \n    // 根据规则处理段落\n    let paragraphs = process_paragraphs(content_lines, ath);\n    }\n    \n    // 渲染导航文件\n    let nav_path = temp_path.join(\"nav.xhtml\");\n    render_nav(book, \u0026tera, \u0026nav_path)?;\n    xhtml_files.push(nav_path);\n    \n    // 渲染CSS文件\n    let css_path = temp_path.join(\"style.css\");\n    render_css(\u0026css_path)?;\n    xhtml_files.push(css_path);\n    \n    // 渲染OPF文件\n    let opf_path = temp_path.join(\"content.opf\");\n    render_opf(book, \u0026xhtml_files, \u0026tera, \u0026opf_path)?;\n    xhtml_files.push(opf_path);\n    \n    // 渲染mimetype文件\n    let mimetype_path = temp_path.join(\"mimetype\");\n    render_mimetype(\u0026mimetype_path)?;\n    xhtml_files.push(mimetype_path);\n    \n    // 渲染container.xml文件\n    let container_path = temp_path.join(\"META-INF/container.xml\");\n    std::fs::create_dir_all(temp_path.join(\"META-INF\"))?;\n    render_container(\u0026container_path)?;\n    xhtml_files.push(container_path);\n    \n    Ok(xhtml_files)\n}\n\n/// 初始化Tera模板引擎\nfn initialize_tera() -\u003e Result\u003cTera\u003e {\n    // 创建Tera实例，添加所有模板\n    let mut tera = Tera::default();\n    \n    // 添加章节模板\n    tera.add_raw_template(\"chapter.xhtml\", include_str!(\"../templates/chapter.xhtml.tera\"))?;\n    \n    // 添加导航模板\n    tera.add_raw_template(\"nav.xhtml\", include_str!(\"../templates/nav.xhtml.tera\"))?;\n    \n    // 添加OPF模板\n    tera.add_raw_template(\"content.opf\", include_str!(\"../templates/content.opf.tera\"))?;\n    \n    Ok(tera)\n}\n\n/// 渲染单个章节为XHTML文件\nfn render_chapter(chapter: \u0026Chapter, chapter_num: usize, book: \u0026Book, tera: \u0026Tera, output_path: \u0026PathBuf) -\u003e Result\u003c()\u003e {\n    let mut context = TeraContext::new();\n    context.insert(\"chapter\", chapter);\n    context.insert(\"chapter_num\", \u0026chapter_num);\n    context.insert(\"book\", book);\n    \n    let rendered = tera.render(\"chapter.xhtml\", \u0026context)?;\n    std::fs::write(output_path, rendered)?;\n    \n    Ok(())\n}\n\n/// 渲染导航文件\nfn render_nav(book: \u0026Book, tera: \u0026Tera, output_path: \u0026PathBuf) -\u003e Result\u003c()\u003e {\n    let mut context = TeraContext::new();\n    context.insert(\"book\", book);\n    \n    let rendered = tera.render(\"nav.xhtml\", \u0026context)?;\n    std::fs::write(output_path, rendered)?;\n    \n    Ok(())\n}\n\n/// 渲染OPF文件\nfn render_opf(book: \u0026Book, xhtml_files: \u0026[PathBuf], tera: \u0026Tera, output_path: \u0026PathBuf) -\u003e Result\u003c()\u003e {\n    let mut context = TeraContext::new();\n    context.insert(\"book\", book);\n    \n    // 收集所有XHTML文件的文件名\n    let xhtml_filenames: Vec\u003cString\u003e = xhtml_files\n        .iter()\n        .filter(|path| path.extension().map(|ext| ext == \"xhtml\").unwrap_or(false))\n        .map(|path| path.file_name().unwrap().to_string_lossy().to_string())\n        .collect();\n    \n    context.insert(\"xhtml_files\", \u0026xhtml_filenames);\n    \n    let rendered = tera.render(\"content.opf\", \u0026context)?;\n    std::fs::write(output_path, rendered)?;\n    \n    Ok(())\n}\n\n/// 渲染CSS文件\nfn render_css(output_path: \u0026PathBuf) -\u003e Result\u003c()\u003e {\n    // 使用默认CSS内容\n    let css_content = include_str!(\"../resources/css/default.css\");\n    std::fs::write(output_path, css_content)?;\n    \n    Ok(())\n}\n\n/// 渲染mimetype文件\nfn render_mimetype(output_path: \u0026PathBuf) -\u003e Result\u003c()\u003e {\n    std::fs::write(output_path, \"application/epub+zip\")?;\n    \n    Ok(())\n}\n\n/// 渲染container.xml文件\nfn render_container(output_path: \u0026PathBuf) -\u003e Result\u003c()\u003e {\n    let container_content = r#\"\u003c?xml version=\"1.0\" encoding=\"UTF-8\"?\u003e\n\u003ccontainer version=\"1.0\" xmlns=\"urn:oasis:names:tc:opendocument:xmlns:container\"\u003e\n  \u003crootfiles\u003e\n    \u003crootfile full-path=\"content.opf\" media-type=\"application/oebps-package+xml\"/\u003e\n  \u003c/rootfiles\u003e\n\u003c/container\u003e\"#;\n    \n    std::fs::write(output_path, container_content)?;\n    \n    Ok(())\n}\n","traces":[ ess":[],"length":0,"stats":{"Line":0}},{"line":147,"address":[],"length":0,"stats":{"Line":0}}],"covered":0,"coverable":74},{"path":["/","Volumes","Storage","Documents","project","book-smith","tests","comprehensive_unit_test.rs"],"content":"use booksmith::{convert_chinese_to_arabic, convert_english_to_arabic, convert_roman_to_arabic, convert_number, extract_chapter_number};\nuse booksmith::models::{ChapterNumberExtraction, ChapterNumberRule};\n\n#[test]\nfn test_chinese_number_conversion() {\n    // 测试阿拉伯数字直接转换\n    assert_eq!(convert_chinese_to_arabic(\"1\"), Some(1));\n    assert_eq!(convert_chinese_to_arabic(\"10\"), Some(10));\n    assert_eq!(convert_chinese_to_arabic(\"100\"), Some(100));\n    \n    // 测试简单中文数字\n    assert_eq!(convert_chinese_to_arabic(\"一\"), Some(1));\n    assert_eq!(convert_chinese_to_arabic(\"二\"), Some(2));\n    assert_eq!(convert_chinese_to_arabic(\"九\"), Some(9));\n    \n    // 测试复杂中文数字\n    assert_eq!(convert_chinese_to_arabic(\"十\"), Some(10));\n    assert_eq!(convert_chinese_to_arabic(\"十一\"), Some(11));\n    assert_eq!(convert_chinese_to_arabic(\"二十\"), Some(20));\n    assert_eq!(convert_chinese_to_arabic(\"三十一\"), Some(31));\n    assert_eq!(convert_chinese_to_arabic(\"一百\"), Some(100));\n    assert_eq!(convert_chinese_to_arabic(\"一百零一\"), Some(101));\n    assert_eq!(convert_chinese_to_arabic(\"二百三十\"), Some(230));\n    assert_eq!(convert_chinese_to_arabic(\"一千二百三十四\"), Some(1234));\n    \n    // 测试无法识别的中文数字\n    assert_eq!(convert_chinese_to_arabic(\"未知\"), None);\n    assert_eq!(convert_chinese_to_arabic(\"abc\"), None);\n}\n\n#[test]\nfn test_english_number_conversion() {\n    // 测试阿拉伯数字直接转换\n    assert_eq!(convert_english_to_arabic(\"1\"), Some(1));\n    assert_eq!(convert_english_to_arabic(\"10\"), Some(10));\n    \n    // 测试英文单词数字\n    assert_eq!(convert_english_to_arabic(\"one\"), Some(1));\n    assert_eq!(convert_english_to_arabic(\"One\"), Some(1));\n    assert_eq!(convert_english_to_arabic(\"ONE\"), Some(1));\n    assert_eq!(convert_english_to_arabic(\"two\"), Some(2));\n    assert_eq!(convert_english_to_arabic(\"nine\"), Some(9));\n    assert_eq!(convert_english_to_arabic(\"ten\"), Some(10));\n    \n    // 测试无法识别的英文数字\n    assert_eq!(convert_english_to_arabic(\"eleven\"), None);\n    assert_eq!(convert_english_to_arabic(\"abc\"), None);\n}\n\n#[test]\nfn test_roman_number_conversion() {\n    // 测试基本罗马数字\n    assert_eq!(convert_roman_to_arabic(\"I\"), Some(1));\n    assert_eq!(convert_roman_to_arabic(\"V\"), Some(5));\n    assert_eq!(convert_roman_to_arabic(\"X\"), Some(10));\n    assert_eq!(convert_roman_to_arabic(\"L\"), Some(50));\n    assert_eq!(convert_roman_to_arabic(\"C\"), Some(100));\n    assert_eq!(convert_roman_to_arabic(\"D\"), Some(500));\n    assert_eq!(convert_roman_to_arabic(\"M\"), Some(1000));\n    \n    // 测试组合罗马数字\n    assert_eq!(convert_roman_to_arabic(\"II\"), Some(2));\n    assert_eq!(convert_roman_to_arabic(\"III\"), Some(3));\n    assert_eq!(convert_roman_to_arabic(\"IV\"), Some(4));\n    assert_eq!(convert_roman_to_arabic(\"VI\"), Some(6));\n    assert_eq!(convert_roman_to_arabic(\"IX\"), Some(9));\n    assert_eq!(convert_roman_to_arabic(\"XII\"), Some(12));\n    assert_eq!(convert_roman_to_arabic(\"XXI\"), Some(21));\n    assert_eq!(convert_roman_to_arabic(\"XLV\"), Some(45));\n    assert_eq!(convert_roman_to_arabic(\"XC\"), Some(90));\n    assert_eq!(convert_roman_to_arabic(\"CD\"), Some(400));\n    assert_eq!(convert_roman_to_arabic(\"CM\"), Some(900));\n    assert_eq!(convert_roman_to_arabic(\"MCMXCIV\"), Some(1994));\n    \n    // 测试小写罗马数字\n    assert_eq!(convert_roman_to_arabic(\"i\"), Some(1));\n    assert_eq!(convert_roman_to_arabic(\"ii\"), Some(2));\n    assert_eq!(convert_roman_to_arabic(\"iii\"), Some(3));\n    assert_eq!(convert_roman_to_arabic(\"iv\"), Some(4));\n    assert_eq!(convert_roman_to_arabic(\"v\"), Some(5));\n    \n    // 测试无法识别的罗马数字\n    assert_eq!(convert_roman_to_arabic(\"A\"), None);\n    assert_eq!(convert_roman_to_arabic(\"abc\"), None);\n}\n\n#[test]\nfn test_unified_number_conversion() {\n    // 测试阿拉伯数字转换\n    assert_eq!(convert_number(\"1\", \"arabic\"), Some(1));\n    assert_eq!(convert_number(\"10\", \"arabic\"), Some(10));\n    \n    // 测试中文数字转换\n    assert_eq!(convert_number(\"一\", \"chinese\"), Some(1));\n    assert_eq!(convert_number(\"十\", \"chinese\"), Some(10));\n    \n    // 测试英文数字转换\n    assert_eq!(convert_number(\"one\", \"english\"), Some(1));\n    assert_eq!(convert_number(\"ten\", \"english\"), Some(10));\n    \n    // 测试罗马数字转换\n    assert_eq!(convert_number(\"I\", \"roman\"), Some(1));\n    assert_eq!(convert_number(\"X\", \"roman\"), Some(10));\n    \n    // 测试自动识别\n    assert_eq!(convert_number(\"1\", \"auto\"), Some(1));\n    assert_eq!(convert_number(\"一\", \"auto\"), Some(1));\n    assert_eq!(convert_number(\"one\", \"auto\"), Some(1));\n    assert_eq!(convert_number(\"I\", \"auto\"), Some(1));\n    \n    // 测试无法识别的数字\n    assert_eq!(convert_number(\"unknown\", \"auto\"), None);\n    assert_eq!(convert_number(\"abc\", \"arabic\"), None);\n}\n\n#[test]\nfn test_chapter_number_extraction() {\n    // 测试默认规则下的中文数字提取\n    assert_eq!(extract_chapter_number(\"第1章\", \u0026None), Some(1));\n    assert_eq!(extract_chapter_number(\"1章\", \u0026None), Some(1));\n    assert_eq!(extract_chapter_number(\"第一章\", \u0026None), Some(1));\n    assert_eq!(extract_chapter_number(\"第十章\", \u0026None), Some(10));\n    assert_eq!(extract_chapter_number(\"第10章\", \u0026None), Some(10));\n    assert_eq!(extract_chapter_number(\"第1节\", \u0026None), Some(1));\n    assert_eq!(extract_chapter_number(\"第1卷\", \u0026None), Some(1));\n    assert_eq!(extract_chapter_number(\"第1张\", \u0026None), Some(1));\n    \n    // 测试默认规则下的英文数字提取\n    assert_eq!(extract_chapter_number(\"Chapter 1\", \u0026None), Some(1));\n    assert_eq!(extract_chapter_number(\"Chapter Two\", \u0026None), Some(2));\n    assert_eq!(extract_chapter_number(\"Section 1\", \u0026None), Some(1));\n    \n    // 测试默认规则下的罗马数字提取\n    assert_eq!(extract_chapter_number(\"Chapter I\", \u0026None), Some(1));\n    assert_eq!(extract_chapter_number(\"Chapter II\", \u0026None), Some(2));\n    assert_eq!(extract_chapter_number(\"Section III\", \u0026None), Some(3));\n    \n    // 测试无法提取章节号的情况\n    assert_eq!(extract_chapter_number(\"序\", \u0026None), None);\n    assert_eq!(extract_chapter_number(\"番外：某件小事\", \u0026None), None);\n    assert_eq!(extract_chapter_number(\"尾声\", \u0026None), None);\n}\n\n#[test]\nfn test_custom_extraction_rules() {\n    // 创建自定义规则\n    let custom_rules = ChapterNumberExtraction {\n        rules: vec![\n            ChapterNumberRule {\n                pattern: \"^Episode ([0-9]+):\".to_string(),\n                capture_group: 1,\n                number_type: \"arabic\".to_string(),\n            },\n            ChapterNumberRule {\n                pattern: \"^Special ([0-9]+):\".to_string(),\n                capture_group: 1,\n                number_type: \"arabic\".to_string(),\n            },\n        ],\n    };\n    \n    // 测试自定义规则\n    assert_eq!(extract_chapter_number(\"Episode 1: The Beginning\", \u0026Some(custom_rules.clone())), Some(1));\n    assert_eq!(extract_chapter_number(\"Episode 2: The Journey\", \u0026Some(custom_rules.clone())), Some(2));\n    assert_eq!(extract_chapter_number(\"Special 1: Bonus Content\", \u0026Some(custom_rules.clone())), Some(1));\n    \n    // 测试自定义规则无法匹配的情况\n    assert_eq!(extract_chapter_number(\"Chapter 1\", \u0026Some(custom_rules.clone())), None);\n    assert_eq!(extract_chapter_number(\"第1章\", \u0026Some(custom_rules.clone())), None);\n}\n\n#[test]\nfn test_mixed_chapter_formats() {\n    // 测试混合章节格式\n    let extraction_rules = None;\n    \n    // 测试各种格式的章节号提取\n    assert_eq!(extract_chapter_number(\"第1章\", \u0026extraction_rules), Some(1));\n    assert_eq!(extract_chapter_number(\"Chapter 1\", \u0026extraction_rules), Some(1));\n    assert_eq!(extract_chapter_number(\"Chapter I\", \u0026extraction_rules), Some(1));\n    assert_eq!(ext Volumes","Storage","Documents","project","book-smith","tests","unit_test.rs"],"content":"use regex::Regex;\n\n#[test]\nfn test_chinese_to_arabic() {\n    // 直接调用二进制文件的函数可能比较复杂，我们可以测试正则表达式的功能\n    // 测试中文数字提取\n    let regex = Regex::new(r\"^(?:第)?([一二三四五六七八九十0-9]+)[章节张卷]\").unwrap();\n    \n    assert!(regex.is_match(\"第1章\"));\n    assert!(regex.is_match(\"1章\"));\n    assert!(regex.is_match(\"第一章\"));\n    assert!(regex.is_match(\"第十章\"));\n    assert!(regex.is_match(\"第10章\"));\n}\n\n#[test]\nfn test_english_chapter_regex() {\n    // 测试英文章节提取\n    let regex = Regex::new(r\"^Chapter\\s+\").unwrap();\n    \n    assert!(regex.is_match(\"Chapter 1\"));\n    assert!(regex.is_match(\"Chapter Two\"));\n    assert!(regex.is_match(\"Chapter III\"));\n}\n\n#[test]\nfn test_roman_chapter_regex() {\n    // 测试罗马数字章节提取\n    let regex = Regex::new(r\"^Chapter\\s+([IVXLCDMivxlcdm]+)\").unwrap();\n    \n    assert!(regex.is_match(\"Chapter I\"));\n    assert!(regex.is_match(\"Chapter II\"));\n    assert!(regex.is_match(\"Chapter III\"));\n    assert!(regex.is_match(\"Chapter X\"));\n}\n\n#[test]\nfn test_custom_rule_regex() {\n    // 测试自定义规则章节提取\n    let regex = Regex::new(r\"^Episode ([0-9]+):\").unwrap();\n    \n    assert!(regex.is_match(\"Episode 1: The Beginning\"));\n    assert!(regex.is_match(\"Episode 2: The Journey\"));\n    assert!(regex.is_match(\"Episode 3: The End\"));\n}\n\n#[test]\nfn test_chapter_regex_priority() {\n    // 测试章节正则表达式优先级\n    let regexes = vec![\n        Regex::new(r\"^Chapter\\s+\").unwrap(),\n        Regex::new(r\"^Section\\s+\").unwrap(),\n        Regex::new(r\"^Part\\s+\").unwrap(),\n    ];\n    \n    // 应该匹配第一个正则表达式\n    let title = \"Chapter 1\";\n    let mut matched = false;\n    for regex in \u0026regexes {\n        if regex.is_match(title) {\n            matched = true;\n            break;\n        }\n    }\n    assert!(matched);\n}\n","traces":[],"covered":0,"coverable":0}]};

    <script>const e = React.createElement;

function pathToString(path) {
  if (path[0] === '/') {
    return '/' + path.slice(1).join('/');
  } else {
    return path.join('/');
  }
}

function findCommonPath(files) {
  if (!files || !files.length) {
    return [];
  }

  function isPrefix(arr, prefix) {
    if (arr.length < prefix.length) {
      return false;
    }
    for (let i = prefix.length - 1; i >= 0; --i) {
      if (arr[i] !== prefix[i]) {
        return false;
      }
    }
    return true;
  }

  let commonPath = files[0].path.slice(0, -1);
  while (commonPath.length) {
    if (files.every(file => isPrefix(file.path, commonPath))) {
      break;
    }
    commonPath.pop();
  }
  return commonPath;
}

function findFolders(files) {
  if (!files || !files.length) {
    return [];
  }

  let folders = files.filter(file => file.path.length > 1).map(file => file.path[0]);
  folders = [...new Set(folders)]; // unique
  folders.sort();

  folders = folders.map(folder => {
    let filesInFolder = files
      .filter(file => file.path[0] === folder)
      .map(file => ({
        ...file,
        path: file.path.slice(1),
        parent: [...file.parent, file.path[0]],
      }));

    const children = findFolders(filesInFolder); // recursion

    return {
      is_folder: true,
      path: [folder],
      parent: files[0].parent,
      children,
      covered: children.reduce((sum, file) => sum + file.covered, 0),
      coverable: children.reduce((sum, file) => sum + file.coverable, 0),
      prevRun: {
        covered: children.reduce((sum, file) => sum + file.prevRun.covered, 0),
        coverable: children.reduce((sum, file) => sum + file.prevRun.coverable, 0),
      },
    };
  });

  return [...folders, ...files.filter(file => file.path.length === 1)];
}

class App extends React.Component {
  constructor(...args) {
    super(...args);

    this.state = {
      current: [],
    };
  }

  componentDidMount() {
    this.updateStateFromLocation();
    window.addEventListener('hashchange', () => this.updateStateFromLocation(), false);
  }

  updateStateFromLocation() {
    if (window.location.hash.length > 1) {
      const current = window.location.hash.slice(1).split('/');
      this.setState({current});
    } else {
      this.setState({current: []});
    }
  }

  getCurrentPath() {
    let file = this.props.root;
    let path = [file];
    for (let p of this.state.current) {
      file = file.children.find(file => file.path[0] === p);
      if (!file) {
        return path;
      }
      path.push(file);
    }
    return path;
  }

  render() {
    const path = this.getCurrentPath();
    const file = path[path.length - 1];

    let w = null;
    if (file.is_folder) {
      w = e(FilesList, {
        folder: file,
        onSelectFile: this.selectFile.bind(this),
        onBack: path.length > 1 ? this.back.bind(this) : null,
      });
    } else {
      w = e(DisplayFile, {
        file,
        onBack: this.back.bind(this),
      });
    }

    return e('div', {className: 'app'}, w);
  }

  selectFile(file) {
    this.setState(
      ({current}) => {
        return {current: [...current, file.path[0]]};
      },
      () => this.updateHash(),
    );
  }

  back(file) {
    this.setState(
      ({current}) => {
        return {current: current.slice(0, current.length - 1)};
      },
      () => this.updateHash(),
    );
  }

  updateHash() {
    if (!this.state.current || !this.state.current.length) {
      window.location = '#';
    } else {
      window.location = '#' + this.state.current.join('/');
    }
  }
}

function FilesList({folder, onSelectFile, onBack}) {
  let files = folder.children;
  return e(
    'div',
    {className: 'display-folder'},
    e(FileHeader, {file: folder, onBack}),
    e(
      'table',
      {className: 'files-list'},
      e('thead', {className: 'files-list__head'}, e('tr', null, e('th', null, 'Path'), e('th', null, 'Coverage'))),
      e(
        'tbody',
        {className: 'files-list__body'},
        files.map(file => e(File, {file, onClick: onSelectFile})),
      ),
    ),
  );
}

function File({file, onClick}) {
  const coverage = file.coverable ? (file.covered / file.coverable) * 100 : -1;
  const coverageDelta =
    file.prevRun && (file.covered / file.coverable) * 100 - (file.prevRun.covered / file.prevRun.coverable) * 100;

  return e(
    'tr',
    {
      className:
        'files-list__file' +
        (coverage >= 0 && coverage < 50 ? ' files-list__file_low' : '') +
        (coverage >= 50 && coverage < 80 ? ' files-list__file_medium' : '') +
        (coverage >= 80 ? ' files-list__file_high' : '') +
        (file.is_folder ? ' files-list__file_folder' : ''),
      onClick: () => onClick(file),
    },
    e('td', null, e('a', null, pathToString(file.path))),
    e(
      'td',
      null,
      file.covered + ' / ' + file.coverable + (coverage >= 0 ? ' (' + coverage.toFixed(2) + '%)' : ''),
      e(
        'span',
        {title: 'Change from the previous run'},
        coverageDelta ? ` (${coverageDelta > 0 ? '+' : ''}${coverageDelta.toFixed(2)}%)` : '',
      ),
    ),
  );
}

function DisplayFile({file, onBack}) {
  return e('div', {className: 'display-file'}, e(FileHeader, {file, onBack}), e(FileContent, {file}));
}

function FileHeader({file, onBack}) {
  const coverage = (file.covered / file.coverable) * 100;
  const coverageDelta = file.prevRun && coverage - (file.prevRun.covered / file.prevRun.coverable) * 100;

  return e(
    'div',
    {className: 'file-header'},
    onBack ? e('a', {className: 'file-header__back', onClick: onBack}, 'Back') : null,
    e('div', {className: 'file-header__name'}, pathToString([...file.parent, ...file.path])),
    e(
      'div',
      {className: 'file-header__stat'},
      'Covered: ' + file.covered + ' of ' + file.coverable + (file.coverable ? ' (' + coverage.toFixed(2) + '%)' : ''),
      e(
        'span',
        {title: 'Change from the previous run'},
        coverageDelta ? ` (${coverageDelta > 0 ? '+' : ''}${coverageDelta.toFixed(2)}%)` : '',
      ),
      e('input', {id: 'theme-toggle', type: 'checkbox', hidden: true}),
      e('label', {for: 'theme-toggle', id: 'theme-toggle-label'}, '🌙'),
    ),
  );
}

function FileContent({file}) {
  return e(
    'pre',
    {className: 'file-content'},
    file.content.split(/\r?\n/).map((line, index) => {
      const trace = file.traces.find(trace => trace.line === index + 1);
      const covered = trace && trace.stats.Line;
      const uncovered = trace && !trace.stats.Line;
      const nbHit = covered? trace.stats.Line: 0;
      return e(
        'div',
        { className: 'code-text-container' },
        e(
          'code',
          {
            className: 'code-line' + (covered ? ' code-line_covered' : '') + (uncovered ? ' code-line_uncovered' : ''),
          },
          line
        ),
        e(
          'div',
          { className: 'cover-indicator' + (covered? ' check-cover': '') + (uncovered? ' no-cover': '')},
          e(
            'div',
            { className: (covered? 'stat-line-hit': '')},
            covered? nbHit: ""
          )
        )
      );
    }),
  );
}

  const files = data.files.map(file => {
    const path = file.path.slice(commonPath.length);
    const {covered = 0, coverable = 0} = prevFilesMap.get(path.join('/')) || {};
    return {
      ...file,
      path,
      parent: commonPath,
      prevRun: {covered, coverable},
    };
  });

  const children = findFolders(files);

  const root = {
    is_folder: true,
    children,
    path: commonPath,
    parent: [],
    covered: children.reduce((sum, file) => sum + file.covered, 0),
    coverable: children.reduce((sum, file) => sum + file.coverable, 0),
    prevRun: {
      covered: children.reduce((sum, file) => sum + file.prevRun.covered, 0),
      coverable: children.reduce((sum, file) => sum + file.prevRun.coverable, 0),
    },
  };

  ReactDOM.render(e(App, {root, prevFilesMap}), document.getElementById('root'));

  const toggle = document.getElementById('theme-toggle');
  const label = document.getElementById('theme-toggle-label');
  label.textContent = '🌙';

  toggle.addEventListener('change', () => {
    if (toggle.checked) {
      document.documentElement.setAttribute('data-theme', 'dark');
      label.textContent = '☀️';
    } else {
      document.documentElement.removeAttribute('data-theme');
      label.textContent = '🌙';
    }
  });
})();
</script>
</body>
</html>
