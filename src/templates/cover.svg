<?xml version="1.0" encoding="UTF-8"?>
<!--
  EpubSmith 默认封面模板
  ======================
  占位符：
    {{ title_lines }}  书名（自动切行，最多 3 行）
    {{ author }}       作者

  可自定义：背景渐变、装饰、字体、配色。
  使用 cover auto 选项生成封面时生效；
  使用 template export 可导出本文件到本地编辑。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2560" viewBox="0 0 1600 2560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2634"/>
      <stop offset="100%" stop-color="#2e4057"/>
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect width="1600" height="2560" fill="url(#bg)"/>
  <!-- 内边框装饰 -->
  <rect x="120" y="120" width="1360" height="2320" fill="none" stroke="#c9a86a" stroke-width="3" opacity="0.6"/>
  <!-- 书名上方装饰线 -->
  <line x1="500" y1="980" x2="1100" y2="980" stroke="#c9a86a" stroke-width="4"/>
  <!-- 书名（自动多行） -->
  {{ title_lines }}
  <!-- 书名下方装饰线 -->
  <line x1="500" y1="1460" x2="1100" y2="1460" stroke="#c9a86a" stroke-width="4"/>
  <!-- 作者 -->
  <text x="800" y="1620" font-family="PingFang SC, Songti SC, Microsoft YaHei, SimSun, Noto Sans CJK SC, sans-serif" font-size="46" fill="#c9a86a" text-anchor="middle">{{ author }}</text>
  <!-- 底部装饰点 -->
  <circle cx="800" cy="1760" r="6" fill="#c9a86a"/>
</svg>
